# Self-hosted frontend. The default upstream names match docker-compose; set
# the backend/renderer names in a deployment-specific override when needed.
upstream openshorts_backend {
    server backend:8000;
}

upstream openshorts_renderer {
    server renderer:3100;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Keep API, MCP, local media and the render helper on the same origin as
    # the dashboard. This avoids hosted-domain assumptions and keeps browser
    # BYOK headers on requests to the local instance.
    location /api/ {
        proxy_pass http://openshorts_backend;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
    }
    location = /mcp {
        proxy_pass http://openshorts_backend;
        proxy_http_version 1.1;
        proxy_read_timeout 600s;
    }
    location /videos/ {
        proxy_pass http://openshorts_backend;
        proxy_http_version 1.1;
    }
    location /thumbnails/ {
        proxy_pass http://openshorts_backend;
        proxy_http_version 1.1;
    }
    location /render/ {
        proxy_pass http://openshorts_renderer;
        proxy_http_version 1.1;
        proxy_read_timeout 600s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The dashboard uses hash routes, so unknown paths can safely fall back to
    # the SPA shell for local navigation.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
